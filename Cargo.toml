[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
cyto-ibu-umi-correct = { path = "crates/cyto-ibu-umi-correct", version = "0.2.3" }
cyto-ibu-cat = { path = "crates/cyto-ibu-cat", version = "0.2.1" }
cyto-ibu-count = { path = "crates/cyto-ibu-count", version = "0.2.1" }
cyto-ibu-reads = { path = "crates/cyto-ibu-reads", version = "0.2.1" }
cyto-ibu-sort = { path = "crates/cyto-ibu-sort", version = "0.2.2" }
cyto-ibu-view = { path = "crates/cyto-ibu-view", version = "0.2.1" }
cyto-cli = { path = "crates/cyto-cli", version = "0.8.1" }
cyto-download = { path = "crates/cyto-download", version = "0.1.1" }
cyto-io = { path = "crates/cyto-io", version = "0.2.0" }
cyto-map = { path = "crates/cyto-map", version = "0.6.0" }
cyto-workflow = { path = "crates/cyto-workflow", version = "0.3.3" }

anyhow = "1.0.104"
binseq = { version = "0.10.0", default-features = false, features = ["anyhow"] }
bitnuc = "0.5.7"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.11"
hashbrown = "0.17.1"
ibu = "0.3.0"
log = "0.4.34"
niffler = { version = "3.0.1", features = ["gz"] }
paraseq = "0.6.2"
parking_lot = "0.13"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1.0.154"

# Optimize third-party deps (seqhash, flate2, ...) in dev/test builds; workspace
# crates stay unoptimized for fast incremental compiles.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# debug = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
struct_field_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
len_without_is_empty = "allow"
