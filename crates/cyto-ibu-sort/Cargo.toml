[package]
name = "cyto-ibu-sort"
version = "0.2.2"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Noam Teyssier"]
description = "Ultra high-throughput processing of 10x-flex single-cell sequencing data"
repository = "https://github.com/noamteyssier/cyto"
categories = ["command-line-utilities", "science::bioinformatics"]
keywords = ["flex", "binseq", "single-cell", "probe", "sequencing"]

[dependencies]
anyhow = { workspace = true }
cyto-cli = { workspace = true }
cyto-io = { workspace = true }
ibu = { workspace = true, features = ["serde"] }
log = { workspace = true }

ext-sort = { version = "0.1.6", features = ["memory-limit"] }
bytesize = "2.7.0"

[lints]
workspace = true
